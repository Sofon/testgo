# Data Pipeline Service Configuration
# Этот файл содержит настройки подключений (MQTT, QuestDB, EventBus)
# ServiceConfig (batch_size, flush_interval, write_timeout, stream_mapping) хранится в MongoDB

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30    # секунды
  write_timeout: 30   # секунды
  mode: "release"     # debug, release, test

mongodb:
  uri: "mongodb://localhost:27017"
  database: "data_pipeline"
  collection: "service_config"
  connect_timeout: 10  # секунды
  max_pool_size: 10

# Fallback файловое хранилище для ServiceConfig (используется если MongoDB недоступен)
file:
  path: "./config/service-config.json"

logger:
  level: "info"       # debug, info, warn, error
  format: "json"      # json, console

# Конфигурация пайплайна (подключения читаются из файла)
pipeline:
  # MQTT Data Bus - шина данных для приёма сигналов
  mqtt:
    broker: "localhost"
    port: 1883
    client_id: "data-pipeline-service"
    username: ""
    password: ""
    topics:
      - "sensors/#"
      - "telemetry/#"
    qos: 1
    clean_start: true
    keep_alive: 60
    use_tls: false

  # Event Bus - шина событий (отдельный EMQX для публикации событий)
  event_bus:
    enabled: true
    broker: "localhost"
    port: 1883
    client_id: "data-pipeline-events"
    username: ""
    password: ""
    topic_prefix: "events/data-pipeline"
    qos: 1
    use_tls: false

  # QuestDB - подключение к хранилищу
  questdb:
    host: "localhost"
    ilp_port: 9009     # InfluxDB Line Protocol порт
    http_port: 9000    # HTTP порт для health-проверок
    use_tls: false
    auth_token: ""

  # Pipeline - настройки обработки (читаются из файла)
  pipeline:
    buffer_size: 10000
    workers: 4
    retry_attempts: 3
    retry_delay: 1000   # миллисекунды
    message_format: "json"
    timestamp_field: "timestamp"
    symbol_field: "device_id"
    field_mappings:
      - source: "device_id"
        target: "device_id"
        type: "symbol"
        required: true
      - source: "value"
        target: "value"
        type: "double"
        required: true
      - source: "timestamp"
        target: "ts"
        type: "timestamp"
        required: true
